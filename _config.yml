# Core site identity
locale                   : "en-US"
portfolio_accent         : "blue" # Change to "orange" to switch the complete accent palette.
portfolio_style          : "bold" # Change to "folio" to use the quieter original portfolio treatment.
title                    : "Aaron Lin"
title_separator          : "|"
name                     : "Aaron Lin"
description              : "Mechanical Engineering student at Boston University, specializing in aerospace and propulsion"
url                      : https://aaronlin.space
baseurl                  : ""
repository               : "Aaron-Lin-0/Aaron-Lin-0.github.io"

author:
  name                    : "Aaron Lin"
  email                   : "aarontylin@gmail.com"
  linkedin                : "aarontylin"

# Search and social metadata
og_image                 : /images/profile-headshot.jpg
og_description           : "Mechanical engineering junior seeking Summer 2027 internships. Explore rocket nozzle design, robotics, aerodynamic analysis, and experimental work."
social:
  type                    : Person
  name                    : Aaron Lin
  links:
    - https://www.linkedin.com/in/aarontylin/

# Published sources
include:
  - .htaccess
  - _pages
  - files
exclude:
  - _projects/2026-09-01-me360.md
  - tmp
  - docs
  - tools
  - resume-source
  - AGENTS.md
  - DESIGN.md
  - PRODUCT.md
  - README.md
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - vendor
keep_files:
  - .git
  - .svn

# Content rendering
encoding: "utf-8"
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
highlighter: rouge
future: true
lsi: false
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  projects:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: engineering
  - scope:
      path: ""
      type: projects
    values:
      layout: engineering

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
